openapi: 3.0.0
info:
  title: WASAText
  description: |
    This OpenAPI document describes APIs for WASAText project.

    Studente: Francesco Zompanti
    Matricola: 2012601
    e-mail: zompanti.2012601@studenti.uniroma1.it
  version: 0.0.1

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local

tags:
  - name: login
    description: Endpoints for user authentication and session creation
  - name: user
    description: Endpoints for managing user profiles and personal settings
  - name: conversation
    description: Endpoints for retrieving and managing user conversations
  - name: message
    description: Endpoints for sending, forwarding and deleting messages
  - name: comment
    description: Endpoints for adding and removing reactions or comments on messages
  - name: group
    description: Endpoints for creating, updating and managing group chats

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      description: Request schema for user login.
      required: [name, photo]
      properties:
        name:
          type: string
          description: The name of the user to log in.
          example: "Francesco"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 3
          maxLength: 16
        photo:
          type: string
          description: Base64-encoded default photo.
          example: "aGPsaG8"
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
          minLength: 1
          maxLength: 1000000

    LoginResponse:
      type: object
      description: Response schema for user login.
      properties:
        identifier:
          type: string
          description: The identifier of the logged-in user.
          example: "abcdef012345"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50

    UpdateUserRequest:
      type: object
      description: Request schema for updating user information.
      properties:
        name:
          type: string
          description: New username.
          example: "NewName"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 3
          maxLength: 16

    User:
      type: object
      description: User schema.
      required: [id, name, photo]
      properties:
        id:
          type: string
          description: Unique identifier of the user.
          example: "justchecco"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
        name:
          type: string
          description: Name of the user.
          example: "Francesco"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 3
          maxLength: 16
        photo:
          type: string
          description: User photo in base64 encoding.
          example: "aGPsaG8"
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
          minLength: 1
          maxLength: 1000000

    ConversationDetailsSummary:
      type: object
      description: A summary of a conversation between users.
      required: [id, name, members]
      properties:
        id:
          type: string
          description: Unique identifier of the conversation.
          example: "conv123"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
        name:
          type: string
          description: Name of the conversation.
          example: "Group Chat"
          pattern: '^[a-zA-Z0-9_ ]+$'
          minLength: 1
          maxLength: 50
        members:
          type: array
          description: List of user IDs participating in the conversation.
          minItems: 1
          maxItems: 1000
          items:
            type: string
            description: User ID.
            example: "justchecco"
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
        conversationPhoto:
          type: string
          description: Base64-encoded conversation photo (if any).
          example: "aGPsaG8"
          pattern: '^[A-Za-z0-9+/]*={0,2}$'
          minLength: 0
          maxLength: 1000000
        lastMessage:
          $ref: '#/components/schemas/Message'

    ConversationDetails:
      title: "Conversation Details"
      type: object
      description: Detailed conversation schema.
      required: [id, name, members, messages]
      properties:
        id:
          type: string
          description: Unique identifier of the conversation.
          example: "conv123"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
        name:
          type: string
          description: Name of the conversation.
          example: "Group Chat"
          pattern: '^[a-zA-Z0-9_ ]+$'
          minLength: 1
          maxLength: 50
        members:
          type: array
          description: List of user IDs participating in the conversation.
          minItems: 1
          maxItems: 1000
          items:
            type: string
            description: User ID.
            example: "justchecco"
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
        conversationPhoto:
          type: string
          description: Base64-encoded conversation photo (if any).
          example: "aGPsaG8"
          pattern: '^[A-Za-z0-9+/]*={0,2}$'
          minLength: 0
          maxLength: 1000000
        lastMessage:
          $ref: '#/components/schemas/Message'
        messages:
          type: array
          description: List of messages in the conversation.
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Message'

    Message:
      type: object
      description: A message sent in a conversation.
      required:
        - id
        - senderId
        - senderName
        - content
        - timestamp
        - attachment
        - reactionCount
        - reactingUserIds
      properties:
        id:
          type: string
          description: Unique identifier of the message.
          example: "msg123"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
        senderId:
          type: string
          description: ID of the user who sent the message.
          example: "justchecco2"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
        senderName:
          type: string
          description: Name of the sender.
          example: "Alice"
          pattern: '^[a-zA-Z0-9 ]+$'
          minLength: 1
          maxLength: 50
        content:
          type: string
          description: Content of the message.
          example: "Hello, world!"
          pattern: '^.*$'
          minLength: 1
          maxLength: 1000
        timestamp:
          type: string
          format: date-time
          description: When the message was sent.
          example: "2025-11-01T11:08:00Z"
          minLength: 20
          maxLength: 29
        attachment:
          type: string
          description: Base64-encoded attachment (if any).
          example: ""
          pattern: '^[A-Za-z0-9+/]*={0,2}$'
          minLength: 0
          maxLength: 10485760
        reactionCount:
          type: integer
          format: int32
          description: Number of reactions on the message.
          example: 2
          minimum: 0
          maximum: 2147483647
        reactingUserIds:
          type: array
          description: List of user IDs who have reacted to the message.
          minItems: 0
          maxItems: 1000
          items:
            type: string
            example: "justchecco"
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
        replyTo:
          type: string
          description: (Optional) ID of the message being replied to.
          example: ""
          pattern: '^[a-zA-Z0-9_]*$'
          minLength: 0
          maxLength: 50
        replyContent:
          type: string
          description: (Optional) A preview of the message being replied to.
          example: ""
          pattern: '^.*$'
          minLength: 0
          maxLength: 1000
        replySenderName:
          type: string
          description: (Optional) Name of the sender of the replied-to message.
          example: ""
          pattern: '^[a-zA-Z0-9 ]*$'
          minLength: 0
          maxLength: 50
        replyAttachment:
          type: string
          description: (Optional) Base64-encoded attachment from the replied-to message.
          example: ""
          pattern: '^[A-Za-z0-9+/]*={0,2}$'
          minLength: 0
          maxLength: 10485760
        status:
          type: string
          description: (Optional) Delivery/read status; provided only for messages not sent by the authenticated user.
          example: "✓"
          pattern: '^.*$'
          minLength: 0
          maxLength: 10

    ForwardMessageRequest:
      type: object
      description: Request schema for forwarding a message.
      required: [targetConversationId]
      properties:
        targetConversationId:
          type: string
          description: ID of the conversation to which the message will be forwarded.
          example: "conv456"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
        forwarderName:
          type: string
          description: (Optional) Name of the user forwarding the message.
          example: "Francesco"
          pattern: '^[a-zA-Z0-9 ]*$'
          minLength: 0
          maxLength: 50

    AddCommentRequest:
      type: object
      description: Request schema for adding a comment.
      required: [content]
      properties:
        content:
          type: string
          description: The content of the comment.
          example: "Nice post!"
          pattern: '^.*$'
          minLength: 1
          maxLength: 500

    UpdateGroupRequest:
      type: object
      description: Request schema for updating group information.
      required: [groupName]
      properties:
        groupName:
          type: string
          description: New name of the group.
          example: "New Group Name"
          pattern: '^[a-zA-Z0-9_ ]+$'
          minLength: 3
          maxLength: 16

    AddGroupMemberRequest:
      type: object
      description: Request schema for adding a member to a group.
      required: [userId]
      properties:
        userId:
          type: string
          description: ID of the user to add.
          example: "justchecco"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50

    Group:
      type: object
      description: Group schema.
      required: [id, name, members]
      properties:
        id:
          type: string
          description: Unique identifier of the group.
          example: "group123"
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
        name:
          type: string
          description: Name of the group.
          example: "Group Chat"
          pattern: '^[a-zA-Z0-9_ ]+$'
          minLength: 3
          maxLength: 50
        members:
          type: array
          description: List of user IDs that are members of the group.
          minItems: 1
          maxItems: 1000
          items:
            type: string
            description: User ID.
            example: "justchecco"
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
        groupPhoto:
          type: string
          description: Base64-encoded group photo (if any).
          example: "aGPsaG8"
          pattern: '^[A-Za-z0-9+/]*={0,2}$'
          minLength: 0
          maxLength: 1000000

    ConversationDetailsCollection:
      type: object
      description: Container for a list of conversations.
      required: [conversations]
      properties:
        conversations:
          type: array
          description: List of conversations
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ConversationDetailsSummary'

security:
  - BearerAuth: []

paths:
  /session:
    post:
      tags: [login]
      summary: Creates a new session
      description: Creates a new session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                identifier: "abcdef012345"
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                identifier: "abcdef012345"

  /users/photo:
    put:
      tags: [user]
      summary: Updates the authenticated user's photo
      description: Updates the user's photo and returns the updated User object
      operationId: setMyPhoto
      security: [ { BearerAuth: [] } ]
      requestBody:
        description: New photo (JPEG or PNG) as a base64-encoded string
        required: true
        content:
          image/png:
            schema:
              type: string
              format: byte
              description: PNG image file (base64-encoded)
              pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
              minLength: 1
              maxLength: 10485760
          image/jpeg:
            schema:
              type: string
              format: byte
              description: JPEG image file (base64-encoded)
              pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
              minLength: 1
              maxLength: 10485760
      responses:
        '200':
          description: Photo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "justchecco"
                name: "Francesco"
                photo: "aGPsaG8="

  /users/name:
    put:
      tags: [user]
      summary: Updates the authenticated user's username
      description: Updates the user's username
      operationId: setMyUsername
      security: [ { BearerAuth: [] } ]
      requestBody:
        description: New username
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "justchecco"
                name: "Francesco"
                photo: "aGPsaG8="

  /conversations:
    get:
      tags: [conversation]
      summary: Retrieves a list of the authenticated user's conversations
      description: Retrieves conversations
      operationId: getMyConversations
      security: [ { BearerAuth: [] } ]
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetailsCollection'
              example:
                conversations:
                  - id: "conversazionesempio"
                    name: "Chat di Gruppo"
                    members: ["justchecco","justchecco2"]
                    conversationPhoto: "aGPsaG8="
                    lastMessage:
                      id: "msg123"
                      senderId: "justchecco"
                      senderName: "Francesco"
                      content: "Ciao"
                      timestamp: "2025-11-01T11:08:00Z"
                      attachment: ""
                      reactionCount: 0
                      reactingUserIds: []
    post:
      tags: [conversation]
      summary: Starts a new conversation
      description: Creates a new conversation between two users
      operationId: startConversation
      security: [ { BearerAuth: [] } ]
      requestBody:
        description: JSON payload with sender and recipient IDs
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload to start a conversation
              required: [senderId, recipientId]
              properties:
                senderId:
                  type: string
                  description: Sender's ID
                  example: "justchecco"
                  pattern: '^[a-zA-Z0-9_]+$'
                  minLength: 1
                  maxLength: 50
                recipientId:
                  type: string
                  description: Recipient's ID
                  example: "justchecco"
                  pattern: '^[a-zA-Z0-9_]+$'
                  minLength: 1
                  maxLength: 50
      responses:
        '201':
          description: Conversation started successfully and returns the details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'
              example:
                id: "conversazionesempio"
                name: "Chat di Gruppo"
                members: ["justchecco","justchecco2"]
                conversationPhoto: "aGPsaG8="
                lastMessage:
                  id: "msg123"
                  senderId: "justchecco"
                  senderName: "Francesco"
                  content: "Ciao"
                  timestamp: "2025-11-01T11:08:00Z"
                  attachment: ""
                  reactionCount: 0
                  reactingUserIds: []
                messages: []

  /conversations/{conversationId}:
    get:
      tags: [conversation]
      summary: Retrieves details of a specific conversation
      description: Retrieves conversation details
      operationId: getConversation
      security: [ { BearerAuth: [] } ]
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'
              example:
                id: "conversazionesempio"
                name: "Chat di Gruppo"
                members: ["justchecco","justchecco2"]
                conversationPhoto: "aGPsaG8="
                lastMessage:
                  id: "msg123"
                  senderId: "justchecco"
                  senderName: "Francesco"
                  content: "Ciao"
                  timestamp: "2025-11-01T11:08:00Z"
                  attachment: ""
                  reactionCount: 0
                  reactingUserIds: []
                messages: []
        '401':
          description: Unauthorized — missing or invalid token
          content:
            application/json:
              schema:
                type: object
                description: Authentication error response
                required: [error]
                properties:
                  error:
                    type: string
                    description: Error message
                    example: "Invalid or missing authentication token"
                    pattern: '^.*$'
                    minLength: 1
                    maxLength: 200
        '403':
          description: Forbidden - access to this conversation is denied
          content:
            application/json:
              schema:
                type: object
                description: Authorization error response
                required: [error]
                properties:
                  error:
                    type: string
                    description: Error message
                    example: "User not authorized to access this conversation"
                    pattern: '^.*$'
                    minLength: 1
                    maxLength: 200
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                type: object
                description: Resource not found response
                required: [error]
                properties:
                  error:
                    type: string
                    description: Error message
                    example: "Conversation not found"
                    pattern: '^.*$'
                    minLength: 1
                    maxLength: 200

  /conversations/{conversationId}/message:
    post:
      tags: [message]
      summary: Sends a message in a conversation
      description: Sends a message using multipart/form-data
      operationId: sendMessage
      security: [ { BearerAuth: [] } ]
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
      requestBody:
        description: Form data containing message content and an optional attachment
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Form data for sending a message
              properties:
                content:
                  type: string
                  description: Message content
                  pattern: '^(?!\s*$).+$'
                  minLength: 1
                  maxLength: 1000
                attachment:
                  type: string
                  description: Optional image attachment (JPEG, PNG or GIF)
                  example: ""
                  pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
                  minLength: 0
                  maxLength: 10485760
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: "msg123"
                senderId: "justchecco"
                senderName: "Francesco"
                content: "Ciao"
                timestamp: "2025-11-01T11:08:00Z"
                attachment: ""
                reactionCount: 0
                reactingUserIds: []

  /conversations/{conversationId}/message/{messageId}/forward:
    post:
      tags: [message]
      summary: Forwards an existing message to another conversation
      description: Forwards a message to another conversation
      operationId: forwardMessage
      security: [ { BearerAuth: [] } ]
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID with the message to forward
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
        - name: messageId
          in: path
          required: true
          description: Message ID to forward
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
      requestBody:
        description: JSON payload with the target conversation ID
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardMessageRequest'
            example:
              targetConversationId: "conversazionesempio"
      responses:
        '201':
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: "msg123"
                senderId: "justchecco"
                senderName: "Francesco"
                content: "Ciao"
                timestamp: "2025-11-01T11:08:00Z"
                attachment: ""
                reactionCount: 0
                reactingUserIds: []

  /conversations/{conversationId}/message/{messageId}:
    delete:
      tags: [message]
      summary: Deletes a message
      description: Deletes a message from the conversation
      operationId: deleteMessage
      security: [ { BearerAuth: [] } ]
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
        - name: messageId
          in: path
          required: true
          description: Message ID to delete
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
      responses:
        '204':
          description: Message deleted successfully

  /conversations/{conversationId}/message/{messageId}/comment:
    parameters:
      - name: conversationId
        in: path
        required: true
        description: ID of the conversation.
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
      - name: messageId
        in: path
        required: true
        description: ID of the message to comment on.
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_]+$'
          minLength: 1
          maxLength: 50
    post:
      tags: [comment]
      summary: Adds a comment to a message
      description: Adds a comment to the specified message.
      operationId: commentMessage
      security: [ { BearerAuth: [] } ]
      requestBody:
        description: JSON payload with comment content.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequest'
      responses:
        '204':
          description: Comment added successfully.
    delete:
      tags: [comment]
      summary: Removes a comment from a message
      description: Deletes a comment from the specified message.
      operationId: uncommentMessage
      security: [ { BearerAuth: [] } ]
      responses:
        '204':
          description: Comment deleted successfully.

  /search:
    get:
      tags: [conversation, user]
      summary: Searches for users by username
      description: Searches for users matching a query string.
      operationId: searchUsers
      security: [ { BearerAuth: [] } ]
      parameters:
        - name: username
          in: query
          required: true
          description: Username query parameter
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
      responses:
        '200':
          description: Users matching the query.
          content:
            application/json:
              schema:
                type: object
                description: Search result payload containing the matched users.
                required: [users]
                properties:
                  users:
                    type: array
                    description: Array of User objects.
                    minItems: 0
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/User'
              example:
                users:
                  - id: "justchecco"
                    name: "Francesco"
                    photo: "aGPsaG8="

  /groups:
    get:
      tags: [group]
      summary: Retrieves the list of groups for the authenticated user
      description: Retrieves groups.
      operationId: getMyGroups
      security: [ { BearerAuth: [] } ]
      responses:
        '200':
          description: List of groups.
          content:
            application/json:
              schema:
                type: object
                description: Contains a list of groups.
                required: [groups]
                properties:
                  groups:
                    type: array
                    description: List of groups.
                    minItems: 0
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/Group'
              example:
                groups:
                  - id: "group123"
                    name: "Group Chat"
                    members: ["justchecco","justchecco2"]
                    groupPhoto: "aGPsaG8"
    post:
      tags: [group]
      summary: Creates a new group
      description: |
        Creates a new group conversation.
        Expects multipart/form-data with fields for group name, a JSON string of member IDs (in property "membersJson"),
        and a group image.
      operationId: createGroup
      security: [ { BearerAuth: [] } ]
      requestBody:
        description: Group creation data
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Form data for group creation
              properties:
                name:
                  type: string
                  description: Name of the group.
                  example: "Chat Di Gruppo"
                  pattern: '^[a-zA-Z0-9_ ]+$'
                  minLength: 3
                  maxLength: 50
                membersJson:
                  type: string
                  description: A JSON string array of member IDs (including the creator).
                  example: '["justchecco","justchecco2"]'
                  pattern: '^\[.*\]$'
                  minLength: 2
                  maxLength: 1000
                image:
                  type: string
                  description: Group image (JPEG or PNG) as a base64 encoded string.
                  example: "aGPsaG8="
                  pattern: '^[A-Za-z0-9+/]*={0,2}$'
                  minLength: 1
                  maxLength: 10485760
      responses:
        '201':
          description: Group created successfully and returns the canonical Group object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: "Gruppo"
                name: "Group Chat"
                members: ["justchecco","justchecco2"]
                groupPhoto: "aGPsaG8="

