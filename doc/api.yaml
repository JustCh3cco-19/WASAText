openapi: 3.0.0
info:
  title: WASAText
  description: |
    This OpenAPI document describes APIs for WASAText project.

    Studente: Francesco Zompanti
    Matricola: 2012601
    e-mail: zompanti.2012601@studenti.uniroma1.it
  version: 0.0.1

tags:
  - name: login
    description: Endpoints for user authentication and session creation
  - name: user
    description: Endpoints for managing user profiles and personal settings
  - name: conversation
    description: Endpoints for retrieving and managing user conversations
  - name: message
    description: Endpoints for sending, forwarding and deleting messages
  - name: comment
    description: Endpoints for adding and removing reactions or comments on messages
  - name: group
    description: Endpoints for creating, updating and managing group chats

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
  
security:
  - BearerAuth: []

paths:
  /session:
    post:
      tags:
        - login
      summary: Logs in the user
      description: |
        If the user doesn't exist, it will be created and returned an identifier.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      security: []
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: User login action successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                identifier: "abcdef012345"
  /users/photo:
    get:
      tags:
        - user
      summary: Retrieves the authenticated user's photo
      description: Returns the full User object
      operationId: getMyPhoto
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User photo fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "justchecco"
                name: "Francesco"
                photo: "aGPsaG8="
    put:
      tags:
        - user
      summary: Updates the authenticated user's photo
      description: Updates the user's photo and returns the updated User object
      operationId: setMyPhoto
      security:
        - BearerAuth: []
      requestBody:
        description: New photo (JPEG or PNG) as a base64-encoded string
        required: true
        content:
          image/png:
            schema:
              type: string
              format: byte
              description: PNG image file (base64-encoded)
              pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
              minLength: 1
              maxLength: 10485760
          image/jpeg:
            schema:
              type: string
              format: byte
              description: JPEG image file (base64-encoded)
              pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
              minLength: 1
              maxLength: 10485760
      responses:
        '200':
          description: Photo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "justchecco"
                name: "Francesco"
                photo: "aGPsaG8="
  /users/name:
    put:
      tags:
        - user
      summary: Updates the authenticated user's username
      description: Updates the user's username
      operationId: setMyUsername
      security:
        - BearerAuth: []
      requestBody:
        description: New username
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "justchecco"
                name: "Francesco"
                photo: "aGPsaG8="
  /conversations:
    get:
      tags:
        - conversation
      summary: Retrieves a list of the authenticated user's conversations
      description: Retrieves conversations
      operationId: getMyConversations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: object
                description: Contains a list of /conversations
                required:
                  - conversations
                properties:
                  conversations:
                    type: array
                    description: List of conversations
                    minItems: 0
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/ConversationDetailsSummary'
            example:
              conversations:
                - id: "conversazionesempio"
                  name: "Chat di Gruppo"
                  members:
                    - "justchecco"
                    - "justchecco2"
                  conversationPhoto: "aGPsaG8="
                  lastMessage:
                    id: "msg123"
                    senderId: "justchecco"
                    senderName: "Francesco"
                    content: "Ciao"
                    timestamp: "2025-11-1T11:08:00Z"
                    attachment: ""
                    reactionCount: 0
                    reactingUserIds: []
    post:
      tags:
        - conversation
      summary: Starts a new conversation
      description: Creates a new conversation between two users
      operationId: startConversation
      security:
        - BearerAuth: []
      requestBody:
        description: JSON payload with sender and recipient IDs
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload to start a conversation
              required:
                - senderId
                - recipientId
              properties:
                senderId:
                  type: string
                  description: Sender's ID
                  example: "justchecco"
                  pattern: '^[a-zA-Z0-9_]+$'
                  minLength: 1
                  maxLength: 50
                recipientId:
                  type: string
                  description: Recipient's ID
                  example: "justchecco"
                  pattern: '^[a-zA-Z0-9_]+$'
                  minLength: 1
                  maxLength: 50
      responses:
        '201':
          description: Conversation started successfully and returns the details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'
              example:
                conversations:
                  id: "conversazionesempio"
                  name: "Chat di Gruppo"
                  members:
                    - "justchecco"
                    - "justchecco2"
                  conversationPhoto: "aGPsaG8="
                  lastMessage:
                    id: "msg123"
                    senderId: "justchecco"
                    senderName: "Francesco"
                    content: "Ciao"
                    timestamp: "2025-11-1T11:08:00Z"
                    attachment: ""
                    reactionCount: 0
                    reactingUserIds: []
  
  /conversations/{conversationId}:
    get:
      tags:
        - conversation
      summary: Retrieves details of a specific conversation
      description: Retrieves conversation details
      operationId: getMyConversation
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'
              example:
                id: "conversazionesempio"
                name: "Chat di Gruppo"
                members:
                  - "justchecco"
                  - "justchecco2"
                conversationPhoto: "aGPsaG8="
                lastMessage:
                  id: "msg123"
                  senderId: "justchecco"
                  senderName: "Francesco"
                  content: "Ciao"
                  timestamp: "2025-11-1T11:08:00Z"
                  attachment: ""
                  reactionCount: 0
                  reactingUserIds: []
                messages: []
  
  /conversations/{conversationId}/message:
    post:
      tags:
        - message
      summary: Sends a message in a conversation
      description: Sends a message using multipart/form-data
      operationId: sendMessage
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_]+$'
            minLength: 1
            maxLength: 50
      requestBody:
        description: Form data containing message content and an optional attachment
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Form data for sending a message
              properties:
                content:
                  type: string
                  description: Message content
                  pattern: '^(?!\s*$).+$'
                  minLength: 1
                  maxLength: 1000
                attachment:
                  type: string
                  description: Optional image attachment (JPEG, PNG or GIF)
                  example: ""
                  pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
                  minLength: 1
                  maxLength: 10485760
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: "msg123"
                senderId: "justchecco"
                senderName: "Francesco"
                content: "Ciao"
                timestamp: "2025-11-1T11:08:00Z"
                attachment: ""
                reactionCount: 0
                reactingUserIds: []
